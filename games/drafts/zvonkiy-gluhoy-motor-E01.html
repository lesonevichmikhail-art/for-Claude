<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Звонкий или глухой мотор: звонкие и глухие согласные — развитие речи, логопедические игры, игры по Лурии | Дядя Миша</title>
<meta name="description" content="Игра для детей 7–9 лет: ребёнок слушает слог или слово и решает — мотор квадроцикла дрожит (звонкий звук) или тихий (глухой), а в конце слова проверяет звук формой «много»: зуб — зубы.">
<style>
:root{
  --bg:#FFF8F0; --ink:#5B4A3F; --ink2:#8A7767; --card:#FFFFFF; --line:#EADCC9;
  --glow:#F2C14E; --sky1:#FDEBD3; --sky2:#FFF4E4; --grass:#E6EDCF; --grass2:#D4E2B2;
  --soft:#FBE3C6; --soft2:#E4ECCD; --green:#7C9A3D; --dHue:#F6DDBF; --tHue:#E3EAD2;
  --road:#E3C9A0; --road2:#D2B386;
  --ph:#EFE7DC; --phLine:#BCAE9D; --draft:#77706A;
  --top:76px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;font-size:18px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button img{width:100%;height:100%}
img{display:block;max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{position:fixed;inset:0;overflow:hidden;max-width:100%}
.screen{position:absolute;inset:0;padding:var(--top) 10px 10px;display:none;min-height:0;overflow:hidden}
.screen.on{display:flex}
.screen:not(.on){display:none!important}
.meadow{background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--grass) 56%,var(--grass2))}

/* ---------- верхняя полоса ---------- */
#topbar{position:absolute;left:0;right:0;top:0;height:var(--top);z-index:20;display:flex;align-items:center;gap:10px;padding:6px 10px;pointer-events:none}
#topbar>*{pointer-events:auto}
.corner{min-width:64px;font-size:clamp(13px,3.4vw,16px);font-weight:800;color:#B7792F;letter-spacing:.5px;white-space:nowrap}
.ibtn{width:64px;height:64px;border-radius:18px;background:var(--card);box-shadow:0 3px 0 var(--line),0 4px 12px rgba(91,74,63,.12);display:flex;align-items:center;justify-content:center;padding:10px;flex:none}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#infoBtn{margin-left:auto;width:48px;height:48px;border-radius:50%;font-size:24px;font-weight:800;font-family:Georgia,serif;font-style:italic;color:var(--ink2);padding:0}
#earBtn{margin-left:auto}
#phrase{flex:1;min-width:0;text-align:center;font-size:clamp(16px,4vw,21px);font-weight:700;color:var(--ink);line-height:1.15;pointer-events:none;overflow:hidden;max-height:100%}
.hide{display:none!important}
.vhide{visibility:hidden!important}

/* ---------- заглушка картинки ---------- */
.ph{width:100%;height:100%;min-height:40px;border:2px dashed var(--phLine);background:var(--ph);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7C6F63;text-align:center;overflow:hidden;padding:4px}
.ph b{font-size:clamp(14px,3.4vw,22px);line-height:1.1}
.ph small{font-size:10px;opacity:.75;word-break:break-all;line-height:1.1;margin-top:2px}
.phTag{position:absolute;right:6px;bottom:4px;font-size:10px;color:#7C6F63;background:rgba(239,231,220,.85);border:1px dashed var(--phLine);border-radius:6px;padding:1px 5px;pointer-events:none}

/* ---------- заставка ---------- */
#scr-intro{flex-direction:column;align-items:center;justify-content:space-between}
#scr-intro .title{font-size:clamp(22px,5.4vw,34px);font-weight:800;color:var(--ink2);background:rgba(255,248,240,.8);border-radius:14px;padding:2px 14px;text-align:center}
.introRow{display:flex;align-items:flex-end;justify-content:center;gap:4vw;width:100%;flex:1;min-height:0;padding-bottom:4%}
.ihero{height:min(calc(var(--vh,1vh)*28),200px);width:min(26vw,190px);display:flex;align-items:flex-end;justify-content:center;flex:none}
#playBtn{width:clamp(110px,min(28vw,calc(var(--vh,1vh)*26)),180px);height:clamp(110px,min(28vw,calc(var(--vh,1vh)*26)),180px);border-radius:50%;background:#FFE7C2;box-shadow:0 6px 0 #E3B97F,0 10px 24px rgba(217,130,43,.35);display:flex;align-items:center;justify-content:center;animation:soft 2.4s ease-in-out infinite;flex:none;align-self:center}
#playBtn img{width:52%;height:52%;margin-left:8%}
#playBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #E3B97F}
@keyframes soft{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* ---------- дыхание ---------- */
#scr-breath{flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--vh,1vh)*2)}
.bwrap{display:flex;align-items:center;justify-content:center;gap:4vw;flex:1;min-height:0;width:100%}
.bcircle{--d:min(46vw,calc(var(--vh,1vh)*46),300px);width:var(--d);height:var(--d);border-radius:50%;background:radial-gradient(circle at 42% 36%,#FFF1DE,#F3CFA0);box-shadow:0 0 0 10px rgba(243,207,160,.25);position:relative;flex:none;will-change:transform}
.bcircle .bi{position:absolute;inset:22%}
.bcircle .bi img{width:100%;height:100%}
.breg{height:min(calc(var(--vh,1vh)*30),200px);width:min(28vw,170px);display:flex;align-items:flex-end;justify-content:center;will-change:transform;transform-origin:50% 100%}

/* ---------- шлем и перчатки ---------- */
#scr-gear{flex-direction:column;align-items:center;justify-content:space-around;gap:10px}
.gPilot{position:relative;height:min(calc(var(--vh,1vh)*42),300px);width:min(62vw,300px);border-radius:28px;display:flex;align-items:flex-end;justify-content:center;transition:box-shadow .2s;flex:none}
.gPilot .gImg{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.gPilot.over{box-shadow:0 0 0 6px rgba(124,154,61,.7)}
.gPilot .onH{position:absolute;top:-4%;left:50%;width:46%;height:34%;transform:translateX(-50%)}
.gPilot .onG{position:absolute;bottom:2%;right:-6%;width:34%;height:30%}
.gPilot .onH:empty,.gPilot .onG:empty{display:none}
.gItems{display:flex;gap:8vw;justify-content:center}
.gItem{--c:min(34vw,calc(var(--vh,1vh)*22),170px);width:var(--c);height:var(--c);border-radius:22px;background:#fff;box-shadow:0 4px 0 var(--line),0 8px 20px rgba(91,74,63,.14);padding:12px;touch-action:none;transition:transform .3s,box-shadow .2s}
.gItem.drag{transition:none;z-index:15;box-shadow:0 14px 28px rgba(91,74,63,.28)}
.gItem.hint{animation:cardGlow 1.3s ease-in-out 3}
.gItem.used{visibility:hidden}

/* ---------- трасса и моторы ---------- */
#scr-play{display:none;background:linear-gradient(var(--sky2),var(--bg));
  grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"tr tr" "stage stage" "md mt";gap:8px 10px}
#scr-play.on{display:grid}
.track{grid-area:tr;position:relative;height:min(calc(var(--vh,1vh)*22),150px);border-radius:20px;overflow:hidden;
  background:linear-gradient(#DDE8C4,#CFDDB0);background-size:cover;background-position:center;--q:min(24vw,calc(var(--vh,1vh)*13),110px)}
.track .road{position:absolute;left:0;right:0;bottom:10%;height:34%;background:var(--road);border-top:3px solid var(--road2);border-bottom:3px solid var(--road2)}
.track.hasBg .road{background:rgba(227,201,160,.55)}
.track .ticks{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 calc(var(--q)/2) 0 calc(var(--q)/2)}
.track .ticks i{width:6px;height:100%;background:rgba(255,248,240,.7);border-radius:3px}
.track .ticks i.done{background:var(--green)}
.quad{position:absolute;bottom:14%;width:var(--q);height:calc(var(--q)*.78);left:calc(var(--p,0) * (100% - var(--q) - 58px) + 4px);transition:left .9s ease-in-out;display:flex;align-items:flex-end;justify-content:center}
.quad.vib .qi{animation:buzz .12s linear infinite}
.quad.soft .qi{animation:buzz .2s linear 5}
.flag{position:absolute;right:6px;bottom:14%;width:50px;height:62px;border-radius:12px;background:#fff;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#B7692F}
.flag.fill{animation:pop .5s ease-out;background:#FFF1DE}

.stage{grid-area:stage;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--vh,1vh)*1.5);min-height:0;min-width:0}
#listen{--c:min(30vw,calc(var(--vh,1vh)*18),150px);width:var(--c);height:var(--c);border-radius:50%;background:#fff;box-shadow:0 4px 0 var(--line),0 8px 20px rgba(91,74,63,.14);padding:18%;flex:none}
#listen.talk{animation:soft 1s ease-in-out infinite}
.mask{font-size:clamp(34px,min(10vw,calc(var(--vh,1vh)*9)),56px);font-weight:800;letter-spacing:4px;background:#fff;border-radius:16px;padding:0 18px;box-shadow:0 3px 0 var(--line);line-height:1.3}
.mask .gap{display:inline-block;min-width:.8em;border-bottom:4px solid var(--ink2);text-align:center;color:#B7692F}
.mask .gap.fill{border-color:transparent;animation:pop .5s ease-out}
.row2{display:flex;align-items:center;justify-content:center;gap:14px}
#checkBtn{width:88px;height:88px;border-radius:50%;background:#FFE7C2;box-shadow:0 4px 0 #E3B97F,0 6px 16px rgba(217,130,43,.3);padding:12px}
#checkBtn.hint{animation:lupaGlow 1.2s ease-in-out infinite}
@keyframes lupaGlow{0%,100%{box-shadow:0 4px 0 #E3B97F,0 0 0 0 rgba(242,193,78,0)}50%{box-shadow:0 4px 0 #E3B97F,0 0 0 10px rgba(242,193,78,.6)}}
#checkBtn.spark{animation:spark .9s ease-out}
@keyframes spark{0%{box-shadow:0 0 0 0 rgba(242,193,78,.9)}100%{box-shadow:0 0 0 28px rgba(242,193,78,0)}}
#skazalBtn{width:96px;height:96px;border-radius:50%;background:#FFE7C2;box-shadow:0 4px 0 #E3B97F,0 6px 16px rgba(217,130,43,.3);padding:14px;animation:soft 1.6s ease-in-out infinite}
.bigPalm{width:min(36vw,calc(var(--vh,1vh)*22),200px);height:min(36vw,calc(var(--vh,1vh)*22),200px)}

.mot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:24px;padding:8px 6px 6px;min-width:0;min-height:64px;
  box-shadow:0 4px 0 var(--line),0 6px 16px rgba(91,74,63,.12);transition:box-shadow .3s,opacity .3s,transform .2s}
#motD{grid-area:md;background:var(--dHue)}#motT{grid-area:mt;background:var(--tHue)}
.mot .mImg{height:min(calc(var(--vh,1vh)*22),40vw,190px);width:100%;display:flex;align-items:center;justify-content:center}
.mot .cap{font-size:clamp(18px,4.6vw,24px);font-weight:800;margin-top:2px}
.mot:active{transform:translateY(3px)}
#motD .mImg{animation:idleBuzz 3.2s linear infinite}
@keyframes idleBuzz{0%,82%,100%{transform:none}84%,88%,92%,96%{transform:translateX(-2px)}86%,90%,94%,98%{transform:translateX(2px)}}
.mot.glow{animation:cardGlow 1.3s ease-in-out infinite}
.mot.pick{box-shadow:0 0 0 6px rgba(124,154,61,.7)}
.mot.locked{opacity:.5}
@keyframes cardGlow{0%,100%{box-shadow:0 4px 0 var(--line)}50%{box-shadow:0 0 0 7px rgba(242,193,78,.8)}}
@keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}

/* ---------- развилка заботы (внутри экрана игры) ---------- */
#care{grid-area:1/1/-1/-1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;min-height:0;background:var(--bg);border-radius:20px;z-index:5}
#scr-play.caring>*:not(#care){visibility:hidden}
.cScene{flex:1;min-height:0;width:min(100%,560px);border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 3px 0 var(--line)}
.cRow{display:flex;gap:6vw;justify-content:center;width:100%}
.choice{--c:min(38vw,calc(var(--vh,1vh)*22),180px);width:var(--c);display:flex;flex-direction:column;align-items:center;border-radius:22px;background:#fff;box-shadow:0 4px 0 var(--line),0 8px 20px rgba(91,74,63,.14);padding:10px 8px 6px;min-height:64px}
.choice .ci{width:100%;height:calc(var(--c) - 50px)}
.choice .cap{font-size:clamp(16px,4.2vw,20px);font-weight:700;margin-top:4px;line-height:1.1;text-align:center}
.choice.glow{animation:cardGlow 1.3s ease-in-out infinite}
.badges{display:flex;gap:6px;justify-content:center;min-height:44px;flex-wrap:wrap}
.badges .bd{width:44px;height:44px}
.badges .bd.pop{animation:pop .6s ease-out}

/* ---------- финал и мостик ---------- */
#scr-finish{flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--vh,1vh)*2)}
.garage{position:relative;width:min(92vw,560px);height:min(calc(var(--vh,1vh)*40),300px);border-radius:24px;overflow:hidden;background:#F3E3CC;background-size:cover;background-position:center;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4%}
.garage .gq{width:44%;height:60%}
.fincircle{--d:min(26vw,calc(var(--vh,1vh)*20),140px)}
.thumbs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:100%}
.thumbs .th{width:var(--s,34px);height:var(--s,34px)}
#scr-bridge{display:grid;grid-template-columns:76px minmax(0,1fr) 76px;grid-template-rows:auto auto minmax(0,1fr);
  grid-template-areas:"ag top hm" "town town town" "card card card";align-items:center;justify-items:center;gap:10px 8px;padding-top:10px}
.brTop{grid-area:top;display:flex;align-items:flex-end;justify-content:center;gap:8px;min-width:0}
.brTop .reg2{height:min(calc(var(--vh,1vh)*12),100px);width:min(22vw,120px);display:flex;align-items:flex-end;justify-content:center}
.brMost{width:min(28vw,calc(var(--vh,1vh)*15),160px);height:min(28vw,calc(var(--vh,1vh)*15),160px);flex:none}
.brTrail{grid-area:town;display:flex;gap:14px;justify-content:center;--s:min(40px,9vw)}
#againBtn{grid-area:ag}#homeBtn{grid-area:hm}
#scr-bridge .ibtn{width:72px;height:72px;padding:12px}
.adultCard{grid-area:card;align-self:start;max-height:100%;overflow-y:auto;background:#fff;border-radius:20px;border:3px solid var(--line);padding:10px 14px;font-size:21px;line-height:1.28;max-width:640px;width:100%}
.adultCard p{margin:0 0 6px}.adultCard p:last-child{margin:0}
.adultCard .lbl{display:block;font-size:14px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}

/* ---------- пауза ---------- */
#pause{position:absolute;inset:0;z-index:40;background:rgba(91,74,63,.55);display:none;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
#pause.on{display:flex}
#pause .ibtn{width:104px;height:104px;border-radius:26px;padding:20px}
#pause #resumeBtn{width:140px;height:140px;border-radius:50%;background:#FFE7C2;padding:34px 30px 34px 40px}

/* ---------- окно взрослого ---------- */
#adult{position:absolute;inset:0;z-index:50;background:rgba(91,74,63,.6);display:none;justify-content:center;align-items:flex-start;overflow-y:auto;overflow-x:hidden;padding:12px}
#adult.on{display:flex}
.sheet{background:var(--bg);border-radius:22px;max-width:680px;width:100%;padding:18px 18px 24px;font-size:17px;line-height:1.45;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet h2{font-size:20px;margin:18px 0 6px}.sheet h2:first-of-type{margin-top:6px}
.sheet ul,.sheet ol{margin:4px 0;padding-left:22px}
.sheet .three{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-size:19px}
.sheet .three p{margin:0 0 8px}
.sheet .closeRow{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.tbtn{min-height:48px;padding:8px 16px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:16px}
.tbtn.main{background:var(--soft);border-color:#EAB77C}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.seg button{min-height:46px;padding:6px 12px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:15px;font-weight:700}
.seg button.on{background:var(--soft2);border-color:var(--green)}
.setl{font-weight:800;font-size:15px;margin-top:8px}
.log{font-size:15px;background:#fff;border-radius:12px;padding:8px 12px;border:1px solid var(--line)}
.sheet .sign{margin-top:24px;opacity:.75;font-weight:700}

/* ---------- черновой голос ---------- */
#draft{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--draft);color:#fff;font-size:13px;padding:5px 10px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#draft.on{opacity:.92}

.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
body.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){
  #playBtn,#skazalBtn,#listen.talk{animation:none}
  #motD .mImg{animation:none}
  .quad.vib .qi{animation:buzz .3s linear infinite}
  .quad{transition-duration:.4s}
}

/* ---------- альбом: моторы по бокам ---------- */
@media (orientation:landscape){
  :root{--top:70px}
  #scr-play{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"tr tr tr" "md stage mt"}
  .track{height:min(calc(var(--vh,1vh)*24),150px);--q:min(14vw,calc(var(--vh,1vh)*14),110px)}
  .mot{align-self:center}
  .mot .mImg{height:min(calc(var(--vh,1vh)*28),22vw,200px)}
  #scr-gear{flex-direction:row}
  .gItems{flex-direction:column;gap:4vh}
  .gPilot{height:min(calc(var(--vh,1vh)*62),320px);width:min(34vw,300px)}
  .cScene{width:min(60vw,560px)}
  .choice{--c:min(22vw,calc(var(--vh,1vh)*28),180px)}
  #scr-bridge{grid-template-columns:minmax(80px,1fr) minmax(80px,1fr) minmax(0,min(640px,62vw));grid-template-rows:minmax(0,1fr) auto auto;
    grid-template-areas:"top top card" "town town card" "ag hm card";column-gap:14px}
  .adultCard{align-self:center}
  .brTop{max-width:100%}
  .brMost{width:min(11vw,calc(var(--vh,1vh)*26),170px);height:min(11vw,calc(var(--vh,1vh)*26),170px)}
  .brTop .reg2{height:min(calc(var(--vh,1vh)*22),130px);width:min(10vw,120px)}
  .garage{height:min(calc(var(--vh,1vh)*52),300px)}
}
@media (orientation:portrait) and (max-height:620px){ .adultCard{line-height:1.22} #scr-bridge{gap:6px} }
@media (max-width:400px){ .corner{font-size:13px} }
@media (max-height:420px){ :root{--top:66px}
  .screen{padding-left:6px;padding-right:6px;padding-bottom:6px}
  .mask{font-size:30px}
  #checkBtn{width:70px;height:70px;padding:10px}
  .mot .cap{font-size:17px}
}
@media (orientation:landscape) and (max-height:420px){
  #scr-bridge .ibtn{width:64px;height:64px;padding:11px} .adultCard{line-height:1.22;padding:8px 12px}
  .choice .cap{font-size:15px} .badges{min-height:34px} .badges .bd{width:34px;height:34px} }
</style>
</head>
<body>
<h1>Звонкий или глухой мотор: звонкие и глухие согласные. Игра для 1–2 класса</h1>
<div id="app">
  <div id="topbar">
    <div class="corner" id="sign">Дядя Миша</div>
    <button class="ibtn hide" id="pauseBtn" aria-label="Пауза"></button>
    <div id="phrase" aria-live="polite"></div>
    <button class="ibtn hide" id="earBtn" aria-label="Послушать ещё раз"></button>
    <button class="ibtn" id="infoBtn" aria-label="Для взрослого">i</button>
  </div>

  <!-- I блок: вход -->
  <section class="screen meadow" id="scr-intro" aria-label="Заставка">
    <div class="title">Звонкий или глухой мотор</div>
    <div class="introRow">
      <div class="ihero" id="introP"></div>
      <button id="playBtn" aria-label="Играть"></button>
      <div class="ihero" id="introQ"></div>
    </div>
  </section>

  <section class="screen meadow" id="scr-breath" aria-label="Дышим">
    <div class="bwrap">
      <div class="breg" id="bReg"></div>

const CONFIG = {
  id:'e01motor',
  draft: Object.keys(VOICE).some(k => !ZVUK[k]),     // нет хоть одного mp3 — черновой голос
  layers:{ baby:[1,2], junior:[1,3], senior:[1,4] },
  tasksPerRound:5, roundsOptions:[2,3,4],             // круг = 5 участков трассы, после круга — развилка заботы
  askFirst:2,                                         // «Мотор дрожит или тихий?» на первых заданиях круга
  learnWaitMs:6000, gearHintMs:6000,
  checkFirstN:3,                                      // L4: первые 3 слова моторы закрыты до «проверить»
  idle1:15000, idle2:45000,
  fastMs:4000,
  breath:{ inMs:2500, outMs:3500, cycles:3, lo:.8, hi:1.12 }
};

/* ================= ЗВУК (ядро zvuk-igr-dyadya-misha) ================= */
const A = {
  ctx:null, on:true,
  ensure(){
    if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(f,dur,vol,type,slideTo){
    if(!this.on) return;
    const c=this.ensure(); if(!c) return;
    if(V.busy) vol*=0.45;                                  // эффект во время речи — тише голоса
    const t=c.currentTime, o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur*0.8);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+dur*0.18);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.05);
  },
  tap(){     this.tone(660,0.13,0.16,'sine',880); },
  release(){ this.tone(392,0.75,0.15,'sine',587); },
  right(){   this.tone(523,0.35,0.15,'sine',784); },
  hint(){    this.tone(440,0.40,0.12,'sine',392); },
  inhale(){  this.tone(330,0.45,0.09,'sine',440); },
  exhale(){  this.tone(392,0.70,0.09,'sine',262); },
  done(){ [262,330,392,523].forEach((f,i)=>setTimeout(()=>this.tone(f,0.9,0.14),i*120)); },
  /* своё для E01: мотор дрожит — низкое мягкое урчание, тихий мотор — лёгкий шорох */
  toD(){ [0,160,320].forEach(d=>setTimeout(()=>this.tone(147,0.22,0.10,'triangle',165),d)); },
  toT(){ this.tone(880,0.30,0.05,'sine',990); },
  lift(){ this.tone(523,0.10,0.08,'sine',587); },
  back(){ this.tone(392,0.25,0.08,'sine',330); },
  dzin(){ this.tone(988,0.30,0.07,'sine',1175); }       // черновой голос: нет mp3
};

/* ================= ВРЕМЯ, ПАУЗА, ОТМЕНА ================= */
const RT = { epoch:0, paused:false };
class Cancel extends Error{}
function chk(ep){ if(ep!==RT.epoch) throw new Cancel(); }
function ptimer(ms, cb){
  let left=ms, last=performance.now(), dead=false;
  const t=setInterval(()=>{ const now=performance.now(); if(!RT.paused) left-=now-last; last=now; if(left<=0){ clearInterval(t); if(!dead) cb(); } },40);
  return ()=>{ dead=true; clearInterval(t); };
}
function sleep(ms){ const ep=RT.epoch; return new Promise((res,rej)=>{ ptimer(ms,()=> ep===RT.epoch ? res() : rej(new Cancel())); S.cancels.push(()=>rej(new Cancel())); }); }

/* ================= ГОЛОС ДЯДИ МИШИ ================= */
const V = {
  el:null, cache:{}, busy:false, token:0, _res:null, _kill:null,
  stop(){
    this.token++;
    if(this.el){ try{ this.el.pause(); }catch(e){} this.el=null; }
    if(this._kill){ this._kill(); this._kill=null; }
    this.busy=false;
    const r=this._res; this._res=null; if(r) r();
  },
  say(key){
    this.stop();
    const tk=this.token, text=VOICE[key]||key;
    phrase(key);
    return new Promise(res=>{
      this._res=res; this.busy=true;
      const done=()=>{ if(tk!==this.token) return; this.busy=false; this._res=null; this.el=null; draftOff(); res(); };
      const draft=()=>{
        if(tk!==this.token) return;
        draftOn(key,text);
        if(A.on) A.dzin();
        const ms = A.on ? Math.min(4800, 700+text.length*62) : Math.min(1400, 400+text.length*25);
        this._kill=ptimer(ms,done);
      };
      if(ZVUK[key] && A.on){
        let a=this.cache[key]; if(!a){ a=new Audio(ZVUK[key]); this.cache[key]=a; }
        try{ a.currentTime=0; }catch(e){}
        this.el=a; a.onended=done; a.onerror=draft;
        if(!RT.paused){ const p=a.play(); if(p&&p.catch) p.catch(()=>{ if(!RT.paused) draft(); }); }
      } else draft();
    });
  },
  pause(){ if(this.el) try{ this.el.pause(); }catch(e){} },
  resume(){ if(this.el){ const p=this.el.play(); if(p&&p.catch) p.catch(()=>{}); } }
};
let draftT=null;
function draftOn(key,text){
  if(!(CONFIG.draft && S.set.draftBar) || ZVUK[key]) return;
  clearTimeout(draftT); const d=$('#draft'); d.textContent=key+'.mp3 — «'+text+'»'; d.classList.add('on');
}

/* ================= ДЫХАНИЕ ================= */
function breathe(ep, cycles, circle, nose, mouth, extra){
  const B=CONFIG.breath;
  return new Promise((res,rej)=>{
    let t=0, last=performance.now(), cyc=0, phase=-1;
    const total=(B.inMs+B.outMs);
    const ease=x=>0.5-0.5*Math.cos(Math.PI*x);
    function frame(now){
      if(ep!==RT.epoch){ rej(new Cancel()); return; }
      const dt=Math.min(100, now-last); last=now; if(!RT.paused) t+=dt;
      const inCyc=t-cyc*total;
      if(inCyc>=total){ cyc++; if(cyc>=cycles){ apply(B.lo,0); res(); return; } }
      const x=t-cyc*total, isIn=x<B.inMs;
      const ph=isIn?0:1;
      if(ph!==phase){ phase=ph; if(isIn){ A.inhale(); V.say('ob_vdoh'); } else { A.exhale(); V.say('ob_vydoh'); } }
      const k = isIn ? B.lo+(B.hi-B.lo)*ease(x/B.inMs) : B.hi-(B.hi-B.lo)*ease((x-B.inMs)/B.outMs);
      const mOp = isIn ? Math.max(0,1-x/350) : Math.min(1,(x-B.inMs)/350);
      apply(k,mOp);
      requestAnimationFrame(frame);
    }
    function apply(k,mOp){
      circle.style.transform='scale('+k.toFixed(4)+')';
      if(extra) extra.style.transform='scale('+(0.94+(k-B.lo)*0.35).toFixed(4)+')';
      nose.style.opacity=(1-mOp).toFixed(3); mouth.style.opacity=mOp.toFixed(3);
    }
    apply(B.lo,0); requestAnimationFrame(frame);
  });
}

/* ================= ПОДСТРОЙКА ТРУДНОСТИ =================
   Задание = один слог или слово.
   1-й промах: «Попробуем ещё раз?», звучит снова.
   2-й промах = подсказка: слово медленно (_medl), нужный мотор мягко светится, квадроцикл сам чуть дрожит / молчит.
   3-й промах: квадроцикл сам едет с нужным мотором (показ, без акцента).
   Трудное задание — 3 промаха (показ). Чистое — без промахов и подсказок.
   2 трудных подряд → опора (слово дважды — второй раз медленно, квадроцикл сам дрожит/молчит после звука);
   ещё 2 трудных → уровень ниже. 2 чистых подряд → опора уходит; ещё 2 → уровень выше.
   Уровень меняется не чаще раза за круг. «Ухо» и развилки заботы не считаются.
   Первая игра: 2 задания с середины → оба с промахами — вниз к началу; оба чистые и быстрые — выше середины. */
const HINT_AT=2, SHOW_AT=3;
function afterTask(lv, pr, misses, hinted, fast){
  const L=S.log, hard=misses>=SHOW_AT, clean=misses===0 && !hinted;
  L.tasks++; if(hard) L.hard++; if(clean) L.clean++;
  const b=L.byL[lv]||(L.byL[lv]={n:0,miss:0}); b.n++; b.miss+=misses;
  const p=L.byPair[pr]||(L.byPair[pr]={n:0,miss:0}); p.n++; p.miss+=misses;
  S.prevHard=hard;
  if(S.calib){
    S.calibRes.push({misses,fast,clean});
    if(S.calibRes.length>=2){
      S.calib=false; const r=layerRange(), mid=Math.ceil((r[0]+r[1])/2), c=S.calibRes;
      let nl=mid;
      if(c.every(x=>x.misses>0)) nl=r[0];
      else if(c.every(x=>x.clean&&x.fast)) nl=clamp(mid+1,r);
      if(nl!==S.level){ S.level=nl; L.levels.push('подстройка '+nl); }
      S.set.level=S.level; saveSet();
    }
    return;
  }
  if(hard){ S.hardRun++; S.cleanRun=0; } else if(clean){ S.cleanRun++; S.hardRun=0; } else { S.hardRun=0; S.cleanRun=0; }
  const canLevel = S.set.mode==='auto'||S.set.mode==='manual', canSupport = S.set.mode!=='easy';
  const shift=d=>{ if(S.shifted) return; const nl=clamp(S.level+d,layerRange()); if(nl!==S.level){ S.level=nl; S.shifted=true; S.set.level=nl; saveSet(); L.levels.push((d>0?'↑':'↓')+nl); } };
  if(S.hardRun>=2){
    S.hardRun=0;
    if(!S.support){ if(canSupport){ S.support=true; L.supports++; L.levels.push('опора'); } }
    else if(canLevel) shift(-1);
  }
  if(S.cleanRun>=2){
    S.cleanRun=0;
    if(S.support){ if(canSupport){ S.support=false; L.levels.push('без опоры'); } }
    else if(canLevel) shift(+1);
  }
}

/* ================= ВЫБОР ЗАДАНИЯ ================= */
/* без повторов за игру; дрожит/тихий вперемешку — не больше двух одинаковых подряд */
function pickLetter(){
  const ls=S.lastLs;
  if(ls.length>=2 && ls[ls.length-1]===ls[ls.length-2]) return ls[ls.length-1]==='d'?'t':'d';
  return Math.random()<.5?'d':'t';
}
const poolFor=lv=>CONTENT['l'+lv];
function pickTask(lv){
  const pool=poolFor(lv), L=pickLetter(), u=S.used[lv]||(S.used[lv]=[]);
  const key=x=>x.v+'|'+x.L;
  let cand=pool.filter(x=>x.L===L && !u.includes(key(x)));
  if(!cand.length){ pool.forEach(x=>{ if(x.L===L){ const k=u.indexOf(key(x)); if(k>=0) u.splice(k,1); } }); cand=pool.filter(x=>x.L===L); }
  const it=rnd(cand); u.push(key(it));
  return {lv, it, check: lv===4};
}

FLOW.play = async ep=>{
  renderTrack(); renderMotors(); clearStage(); $('#care').classList.add('hide'); $('#scr-play').classList.remove('caring');
  if(!S.log) S.log=newLog();
  const R=+S.set.rounds||3, N=CONFIG.tasksPerRound;
  for(let round=0; round<R; round++){
    chk(ep);
    S.shifted=false; S.pos=0; setPos(0,true); setFlag('?',false);
    for(let k=0;k<N;k++){
      const lastTask = round===R-1 && k===N-1;
      const easyEnd = lastTask && S.prevHard;                    // финал всегда на удаче
      const lv = easyEnd ? layerRange()[0] : S.level;
      if(!S.log.levels.length || S.log.levels[S.log.levels.length-1]!=='L'+lv) S.log.levels.push('L'+lv);
      await runTask(ep, pickTask(lv), k, easyEnd);
    }
    A.done(); await say(ep,'ob_zdorovo');
    await careFork(ep);                                          // развилка — не считается в подстройке
  }
  go('finish');
};

async function runTask(ep, T, k, easyEnd){
  const it=T.it, lv=T.lv, isCheck=T.check;
  S.lastLs.push(it.L);
  clearStage(); S.lock=true; S.pending=null;
  if(isCheck){
    $('#mask').innerHTML=it.m.replace('_','<span class="gap">?</span>'); $('#mask').classList.remove('hide');
    $('#listen').classList.add('hide'); setFlag('?',false);
  }
  if(easyEnd) glowMot(it.L);
  await sleep(250*tempo());

  /* что звучит */
  const stim=[it.v];
  if(S.support) stim.push(slow(it.v));
  let ask=[];
  if(isCheck){
    if(!S.ruleSaid){ S.ruleSaid=true; ask=['e01_finish_vopros','e01_pravilo']; }
    else if(S.checkN<CONFIG.checkFirstN) ask=['e01_finish_vopros'];
    $('#checkBtn').classList.remove('hide'); $('#checkBtn').classList.add('hint');
    if(S.checkN<CONFIG.checkFirstN) lockMots(true);
  } else if(k<CONFIG.askFirst || S.support) ask=['e01_vopros'];
  S.lastInstr=stim.concat(ask);
  $('#listen').classList.add('talk');
  await instr(ep,...stim);
  $('#listen').classList.remove('talk');
  if(S.support && !isCheck) quadHint(it.L);                      // опора: мотор сам чуть дрожит / молчит
  if(ask.length) await instr(ep,...ask);
  S.lastInstr=stim.concat(ask);

  let miss=0, hinted=false, shown=false, checked=false;
  const t0=performance.now();
  S.lock=false;
  while(true){
    const ev=await waitTap(ep);
    if(ev.listen){ S.lock=true; $('#listen').classList.add('talk'); await instr(ep,...S.lastInstr); $('#listen').classList.remove('talk'); S.lock=false; continue; }
    if(ev.check){
      if(!isCheck) continue;
      S.lock=true; $('#checkBtn').classList.remove('hint');
      const b=$('#checkBtn'); b.classList.remove('spark'); void b.offsetWidth; b.classList.add('spark');
      if(!checked){ checked=true; lockMots(false); A.right(); S.log.checkUsed=(S.log.checkUsed||0)+1; }
      const cv = S.support ? [it.cv, slow(it.cv)] : [it.cv];
      await instr(ep,...cv.concat(['e01_vopros']));
      if(S.support && it.L==='d') quadHint('d');
      S.lastInstr=cv.concat(['e01_vopros']);
      S.lock=false; continue;
    }
    if(ev.mot===undefined) continue;
    if(isCheck && S.motLock){                                    // первые слова L4: сначала проверь
      S.lock=true; $('#checkBtn').classList.add('hint'); A.hint(); await instr(ep,'e01_finish_vopros'); S.lock=false; continue;
    }
    if(ev.mot===it.L) break;
    /* промах — мягко */
    miss++; S.log.miss++; S.lock=true; A.hint();
    if(isCheck && !checked){
      S.log.noCheckMiss++; $('#checkBtn').classList.add('hint');
      if(miss<SHOW_AT){ await instr(ep,'e01_pravilo'); S.lock=false; continue; }
    }
    if(miss>=SHOW_AT){ shown=true; S.log.shown++; break; }
    const again = isCheck&&checked ? it.cv : it.v;
    if(miss>=HINT_AT){
      if(!hinted){ hinted=true; S.log.hints++; }
      glowMot(it.L);
      await instr(ep,'ob_medlenno', slow(again)); quadHint(it.L);
    } else {
      await instr(ep,'ob_eshche_raz', again);
    }
    S.lock=false;
  }
  /* верно (или мягкий показ после 3 промахов) */
  S.lock=true; $('#checkBtn').classList.remove('hint');
  const fast=performance.now()-t0<CONFIG.fastMs*tempo();
  S.log.rt.push(Math.round(performance.now()-t0));
  if(isCheck){ S.checkN++; if(!checked && !shown) S.log.noCheckRight++; if(checked && miss===0) S.log.checkFirst++; }
  glowMot(shown?it.L:null);
  const pm=motEl(it.L); pm.classList.add('pick');
  if(!shown) A.right();
  if(isCheck){ const g=$('#mask .gap'); if(g){ g.textContent=it.b; g.classList.add('fill'); } setFlag(it.b,true); }
  await driveQuad(ep, it.L);
  pm.classList.remove('pick'); glowMot(null);
  if(!shown && (k===0 || isCheck)) await say(ep,'ob_est');
  await sleep(300*tempo());
  afterTask(lv, it.pr, shown?Math.max(miss,SHOW_AT):miss, hinted, fast);
}

/* ---- развилка заботы: не влияет на подстройку, без штрафа ---- */
function badgesHTML(n, fresh){ let h=''; for(let i=0;i<n;i++) h+='<div class="bd'+(fresh&&i===n-1?' pop':'')+'">'+pic('ikonka_chestnyy_pilot','честный пилот')+'</div>'; return h; }
async function careFork(ep){
  const c=CONTENT.care[S.careOrder[S.careI++ % S.careOrder.length]];
  const opts=Math.random()<.5?[c.care,c.other]:[c.other,c.care];
  $('#cScene').innerHTML=pic(c.scene, c.who);
  const cap=S.set.age!=='baby';
  opts.forEach((o,i)=>{ const b=$('#ch'+i); b.innerHTML='<div class="ci">'+pic(o.p,o.w)+'</div>'+(cap?'<div class="cap">'+o.w+'</div>':''); b.classList.remove('glow'); b.setAttribute('aria-label',o.w); });
  $('#cBadges').innerHTML=badgesHTML(S.badges);
  $('#scr-play').classList.add('caring'); $('#care').classList.remove('hide');
  S.lock=true;
  await instr(ep,c.v);
  let tries=0;
  S.lock=false;
  while(true){
    const ev=await waitTap(ep);
    if(ev.choice===undefined) continue;
    const o=opts[ev.choice];
    if(o===c.care) break;
    tries++; S.lock=true; A.hint();
    await instr(ep,'e01_chuvstvuet');
    if(tries>=2) $('#ch'+opts.indexOf(c.care)).classList.add('glow');
    S.lastInstr=[c.v,'e01_chuvstvuet'];
    S.lock=false;
  }
  S.lock=true; if(tries===0) S.log.careFirst++; else S.log.careAgain++;
  S.badges++; A.done(); $('#cBadges').innerHTML=badgesHTML(S.badges,true);
  await say(ep,'e01_chestnyy');
  await sleep(600);
  $('#care').classList.add('hide'); $('#scr-play').classList.remove('caring');
}
['ch0','ch1'].forEach((id,i)=>$('#'+id).addEventListener('click',()=>{ if(S.lock||RT.paused) return; A.tap(); onPick({choice:i}); }));

function sheetHTML(){
  const L=S.log, st=S.set;
  const seg=(key,opts)=>'<div class="seg" data-k="'+key+'">'+opts.map(o=>'<button data-v="'+o[0]+'" class="'+(String(st[key])===String(o[0])?'on':'')+'">'+o[1]+'</button>').join('')+'</div>';
  const avg = L && L.rt.length ? (L.rt.reduce((a,b)=>a+b,0)/L.rt.length/1000).toFixed(1)+' с' : '—';
  const byL = L ? Object.keys(L.byL).map(k=>'L'+k+': '+L.byL[k].n+' зад., промахов '+L.byL[k].miss).join(' · ') : '';
  const byP = L ? Object.keys(L.byPair).map(k=>k+': '+L.byPair[k].miss+' из '+L.byPair[k].n).join(' · ') : '';
  const log = L ? '<div class="log">Заданий: '+L.tasks+' · чистых: '+L.clean+' · трудных: '+L.hard+' · подсказок: '+L.hints+' · показали ответ: '+L.shown+' · промахов: '+L.miss+
    '<br>Промахи по парам: '+(byP||'—')+
    '<br>По уровням: '+(byL||'—')+
    '<br>L4 «проверить»: проверил и сразу верно — '+L.checkFirst+' · без проверки угадал — '+L.noCheckRight+' · без проверки промахнулся — '+L.noCheckMiss+
    '<br>Развилки: с заботой сразу — '+L.careFirst+' · после вопроса — '+L.careAgain+
    '<br>Время до ответа: '+avg+' · Опора включалась: '+L.supports+' · паузы 15 с: '+L.idle+
    '<br>Уровни: '+(L.levels.join(' → ')||'—')+'</div>' : '<div class="log">Игра ещё не начата.</div>';
  return ''+
  '<div class="closeRow"><button class="tbtn main" data-act="close">Вернуться к игре</button></div>'+
  '<h2>Три строки для взрослого</h2><div class="three">'+CONTENT.adult3.map(t=>'<p>'+t+'</p>').join('')+'</div>'+
  '<h2>Правило</h2><p>Мотор дрожит — звонкий, тихий — глухой; сомневаешься в конце — скажи «много».</p>'+
  '<h2>Что тренирует</h2><p>Слуховое различение звонких и глухих (II блок — восприятие) и привычку проверять конец слова (III блок — контроль). Пары: б–п, д–т, з–с, ж–ш, в–ф, г–к. Губы говорящего не видны — только слух.</p>'+
  '<h2>Как помочь</h2><ol><li>Рука на горле — ваша и ребёнка: «ззз» дрожит, «ссс» тихо.</li><li>Не называйте ответ. Скажите слово ещё раз медленнее.</li><li>В конце слова спросите: «А как проверить?» — пусть скажет «много» сам.</li></ol>'+
  '<p>Ошибок в игре нет. Не тот мотор — слово звучит ещё раз. Второй раз — слово медленно, нужный мотор светится. Третий — квадроцикл едет сам. После каждых 5 участков — развилка: как поступит пилот. Выбор без заботы — вопрос «А что почувствует…?» и выбор ещё раз, без штрафа.</p>'+
  '<p><b>Подстройка сама.</b> Первая игра начинается с середины и по двум заданиям выбирает уровень. Два трудных задания подряд — опора: слово звучит дважды (второй раз медленно), квадроцикл сам чуть дрожит на звонком. Ещё два трудных — уровень ниже. Два чистых — опора уходит, ещё два — уровень выше. Повторная игра — на ступень легче. Ухо и развилки не считаются.</p>'+
  '<p>Уровни: 1 — слоги с А (ба/па); 2 — слоги с О, У, Ы; 3 — звук в начале слова (бочка/почка); 4 — проверка на финише (зуб → зубы, буква встаёт на финиш).</p>'+
  '<h2>Если трудно</h2><p>Режим «Легко» — нижний уровень и опора всегда. Темп «Медленный». Путает все пары и в жизни часто переспрашивает — покажите ЛОРу или сурдологу. Это не диагноз, просто проверка слуха.</p>'+
  '<h2>Сколько играть</h2><p>5–7 минут, один раз в день (3 круга по 5 участков). Лучше каждый день понемногу.</p>'+
  '<h2>Для специалиста</h2><p>Какие пары путает — строка «Промахи по парам». Путает только в конце слова (L4 без проверки) — это контроль; путает везде, с L1 — это слух.</p>'+log+
  '<h2>Настройки</h2>'+
  '<div class="setl">Возраст</div>'+seg('age',[['baby','5–6 лет'],['junior','6–7 лет'],['senior','8–10 лет']])+
  '<div class="setl">Трудность</div>'+seg('mode',[['auto','Сама'],['easy','Легко'],['hard','Трудно — вместе'],['manual','Начать с уровня…']])+
  (st.mode==='manual'?seg('startLevel',[[1,'1 · слоги с А'],[2,'2 · слоги О, У, Ы'],[3,'3 · начало слова'],[4,'4 · проверка на финише']]):'')+
  '<div class="setl">Темп</div>'+seg('tempo',[['normal','Обычный'],['slow','Медленный']])+
  '<div class="setl">Кругов за игру (по 5 участков)</div>'+seg('rounds',CONFIG.roundsOptions.map(n=>[n,String(n)]))+
  '<div class="setl">Звук и голос</div>'+seg('sound',[[true,'Включён'],[false,'Выключен']])+
  (CONFIG.draft?'<div class="setl">Черновой голос: полоска с текстом фразы</div>'+seg('draftBar',[[true,'Показывать'],[false,'Скрыть']]):'')+
  '<p style="font-size:14px;color:var(--ink2)">Сейчас уровень '+(S.level||'—')+'. Возраст и трудность применятся со следующей игры. <button class="tbtn" data-act="resetLevel">Сбросить подстройку</button></p>'+
  '<div class="closeRow" style="margin-top:14px"><button class="tbtn" data-act="home">Домой</button><button class="tbtn" data-act="restart">Начать заново</button><button class="tbtn main" data-act="close">Вернуться к игре</button></div>'+
  '<p class="sign">Дядя Миша · © 2026 Михаил Лесоневич · «Первый класс без слёз»</p>';
}
function openAdult(){ A.tap(); setPaused(true,false); $('#sheet').innerHTML=sheetHTML(); $('#adult').classList.add('on'); $('#adult').scrollTop=0; }
function closeAdult(){ $('#adult').classList.remove('on'); if(!$('#pause').classList.contains('on')) setPaused(false); }
$('#sheet').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; A.tap();
  const seg=b.closest('.seg');
  if(seg){
    const k=seg.dataset.k; let v=b.dataset.v;
    if(v==='true') v=true; else if(v==='false') v=false; else if(/^\d+$/.test(v)) v=+v;
    S.set[k]=v; if(k==='sound') A.on=v; if(k==='age'||k==='mode'||k==='startLevel') S.set.level=0;
    if(k==='draftBar' && !v) $('#draft').classList.remove('on');
    if(k==='age'){ if(S.screen==='intro') FLOW.intro(RT.epoch); if(v!=='senior') $('#phrase').textContent=''; }
    saveSet(); const y=$('#adult').scrollTop; $('#sheet').innerHTML=sheetHTML(); $('#adult').scrollTop=y; return;
  }
  const act=b.dataset.act;
  if(act==='close') closeAdult();
  if(act==='resetLevel'){ S.set.level=0; saveSet(); $('#sheet').innerHTML=sheetHTML(); }
  if(act==='home'){ $('#adult').classList.remove('on'); $('#pause').classList.remove('on'); setPaused(false); go('intro'); }
  if(act==='restart'){ $('#adult').classList.remove('on'); $('#pause').classList.remove('on'); setPaused(false); startGame(); go('breath'); }
});
$('#adult').addEventListener('click',e=>{ if(e.target.id==='adult') closeAdult(); });

  $('#playBtn').innerHTML=pic('ikonka_igrat','играть');
  $('#pauseBtn').innerHTML=pic('ikonka_pauza','пауза');
  $('#earBtn').innerHTML=pic('ikonka_uho','ещё раз');
  $('#listen').innerHTML=pic('ikonka_uho','слушай');
  $('#checkBtn').innerHTML=pic('ikonka_proverit','проверить');
  $('#skazalBtn').innerHTML=pic('ikonka_skazal','сказал');
  $('#resumeBtn').innerHTML=pic('ikonka_igrat','продолжить');
  $('#pHome').innerHTML=pic('ikonka_domoy','домой'); $('#homeBtn').innerHTML=pic('ikonka_domoy','домой');
  $('#pRestart').innerHTML=pic('ikonka_eshche_raz','заново'); $('#againBtn').innerHTML=pic('ikonka_eshche_raz','ещё раз');
  $('#playBtn').onclick=async()=>{
    if(S.screen!=='intro') return;
    startGame();
    const ep=++RT.epoch; S.lock=true; $('#playBtn').disabled=true;
    try{ await say(ep,'ob_privet'); go('breath'); }catch(e){}
    $('#playBtn').disabled=false;
  };

  $('#pauseBtn').onclick=()=>{ A.tap(); openPause(); };
  $('#resumeBtn').onclick=()=>{ A.tap(); closePause(); };
  $('#pHome').onclick=()=>{ A.tap(); closePause(); setPaused(false); go('intro'); };
  $('#pRestart').onclick=()=>{ A.tap(); closePause(); setPaused(false); startGame(); go('breath'); };
  $('#infoBtn').onclick=openAdult;
  $('#earBtn').onclick=()=>{
    A.tap(); if(RT.paused) return;
    if(!S.lastInstr.length) return;
    if(S.waiting || S.screen==='breath'){ const seq=S.lastInstr.slice(); (async()=>{ for(const k of seq){ await V.say(k); if(!S.waiting && S.screen!=='breath') break; } })(); }
  };
  $('#againBtn').onclick=()=>{ A.tap(); startGame(); go('breath'); };
  $('#homeBtn').onclick=async()=>{ A.tap(); const ep=++RT.epoch; try{ await say(ep,'ob_poka'); }catch(e){} go('intro'); };
}
