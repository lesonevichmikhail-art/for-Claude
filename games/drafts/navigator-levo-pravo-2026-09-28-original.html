<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Навигатор: лево и право — подготовка к 1 классу, развитие внимания, игры по Лурии | Дядя Миша</title>
<meta name="description" content="Игра-навигатор для детей 5–9 лет: браслет на левой руке, машинка поворачивает налево и направо, волшебный фонарь меняет правило. Лево-право от своего тела к дороге и переключение.">
<style>
:root{
  --bg:#FFF8F0; --ink:#5B4A3F; --ink2:#8A7767; --card:#FFFFFF; --line:#EADCC9;
  --left:#D9822B; --leftSoft:#FBE3C6; --right:#7C9A3D; --rightSoft:#E4ECCD;
  --glow:#F2C14E; --sky1:#FDEBD3; --sky2:#FFF8F0; --ground:#EBD9BE;
  --ph:#EFE7DC; --phLine:#BCAE9D; --draft:#77706A; --magic:#8E6BBF; --magicSoft:#EDE3F7;
  --brc:#E8892B;
  --top:76px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;font-size:18px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button img{width:100%;height:100%}
img{display:block;max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{position:fixed;inset:0;overflow:hidden;max-width:100%}
.screen{position:absolute;inset:0;padding:var(--top) 10px 10px;display:none;min-height:0;overflow:hidden}
.screen.on{display:flex}
.screen:not(.on){display:none!important}

/* ---------- верхняя полоса ---------- */
#topbar{position:absolute;left:0;right:0;top:0;height:var(--top);z-index:20;display:flex;align-items:center;gap:10px;padding:6px 10px;pointer-events:none}
#topbar>*{pointer-events:auto}
.corner{min-width:64px;font-size:clamp(13px,3.4vw,16px);font-weight:800;color:#B7792F;letter-spacing:.5px;white-space:nowrap}
.ibtn{width:64px;height:64px;border-radius:18px;background:var(--card);box-shadow:0 3px 0 var(--line),0 4px 12px rgba(91,74,63,.12);display:flex;align-items:center;justify-content:center;padding:10px;flex:none}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#infoBtn{margin-left:auto;width:48px;height:48px;border-radius:50%;font-size:24px;font-weight:800;font-family:Georgia,serif;font-style:italic;color:var(--ink2);padding:0}
#earBtn{margin-left:auto}
#earBtn:not(.hide)+#infoBtn{margin-left:10px}
.hide{display:none!important}
.vhide{visibility:hidden!important}

/* ---------- заглушка картинки ---------- */
.ph{width:100%;height:100%;min-height:40px;border:2px dashed var(--phLine);background:var(--ph);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7C6F63;text-align:center;overflow:hidden;padding:4px}
.ph b{font-size:clamp(15px,3.6vw,24px);line-height:1.1}
.ph small{font-size:10px;opacity:.75;word-break:break-all;line-height:1.1;margin-top:2px}

/* ---------- браслет: пока нет PNG — полоска цвета браслета ребёнка ---------- */
.brc{position:absolute;pointer-events:none;z-index:2}
.brc.band{background:var(--brc);border:3px solid #5B3A1F;border-radius:10px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.brc img{width:100%;height:100%}
.brc.pulse{animation:brcPulse 1.1s ease-in-out infinite}
.brc.flash{animation:brcPulse .55s ease-in-out 4}
@keyframes brcPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(242,193,78,0)}50%{transform:scale(1.12);box-shadow:0 0 0 8px rgba(242,193,78,.75)}}

/* ---------- заставка ---------- */
#scr-intro{flex-direction:column;align-items:center;justify-content:space-between;background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--ground) 56%,#E6D2B3)}
#scr-intro .title{font-size:clamp(20px,5vw,30px);font-weight:800;color:var(--ink2);margin-top:-6px;background:rgba(255,248,240,.8);border-radius:14px;padding:2px 14px}
.introRow{display:flex;align-items:flex-end;justify-content:center;gap:5vw;width:100%;flex:1;min-height:0;padding-bottom:2%}
.introNav{height:min(calc(var(--vh,1vh)*24),170px);width:min(24vw,140px);display:flex;align-items:flex-end;justify-content:center}
.introCar{height:min(calc(var(--vh,1vh)*18),130px);width:min(30vw,200px);display:flex;align-items:flex-end;justify-content:center}
#playBtn{width:clamp(120px,min(32vw,calc(var(--vh,1vh)*30)),190px);height:clamp(120px,min(32vw,calc(var(--vh,1vh)*30)),190px);border-radius:50%;background:#FFE7C2;box-shadow:0 6px 0 #E3B97F,0 10px 24px rgba(217,130,43,.35);display:flex;align-items:center;justify-content:center;animation:soft 2.4s ease-in-out infinite;flex:none}
#playBtn img{width:52%;height:52%;margin-left:8%}
#playBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #E3B97F}
@keyframes soft{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* ---------- дыхание и «Лифт» ---------- */
#scr-breath,#scr-finish{flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--vh,1vh)*2)}
.bwrap{display:flex;align-items:center;justify-content:center;gap:4vw;flex:1;min-height:0;width:100%}
.bcircle{--d:min(46vw,calc(var(--vh,1vh)*46),300px);width:var(--d);height:var(--d);border-radius:50%;background:radial-gradient(circle at 50% 42%,#FFF1DC,#F9D9AE);box-shadow:0 0 0 10px rgba(242,193,78,.18);position:relative;flex:none;will-change:transform}
.bcircle .bi{position:absolute;inset:22%}
.bcircle .bi img{width:100%;height:100%}
.breg{height:min(calc(var(--vh,1vh)*34),220px);width:min(30vw,180px);display:flex;align-items:flex-end;justify-content:center;will-change:transform;transform-origin:50% 100%}
.lift{position:relative;height:min(calc(var(--vh,1vh)*58),440px);aspect-ratio:223/427;max-width:88vw;flex:none}
.lift>img,.lift>.ph{width:100%;height:100%}
.dot{position:absolute;width:13%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:rgba(242,193,78,.55);border:4px solid #E3A33A;box-shadow:0 0 0 8px rgba(242,193,78,.3);transition:left .8s ease-in-out,top .8s ease-in-out;pointer-events:none}
.nextBtn{width:96px;height:80px;border-radius:22px;background:var(--card);box-shadow:0 4px 0 var(--line),0 6px 16px rgba(91,74,63,.14);padding:14px;display:flex;align-items:center;justify-content:center;flex:none}
.nextBtn.pulse{animation:soft 1.8s ease-in-out infinite}

/* ---------- поле игры ---------- */
#scr-play{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"sc sc sc" "L S R"}
.scene{grid-area:sc;position:relative;min-height:0;border-radius:22px;overflow:hidden;background:#F4E6CF center bottom / cover no-repeat;box-shadow:inset 0 0 0 3px var(--line)}
.scene.magic{box-shadow:inset 0 0 0 5px var(--magic),inset 0 0 60px rgba(142,107,191,.35)}
.nav{position:absolute;left:3%;top:4%;height:44%;width:24%;display:flex;align-items:flex-start;justify-content:center;z-index:2}
.nav.talk{animation:talk .5s ease-in-out 2}
@keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.06) rotate(-2deg)}}
.bubble{position:absolute;left:29%;top:5%;min-width:38%;max-width:68%;height:34%;background:#fff;border-radius:22px;border:3px solid var(--line);box-shadow:0 4px 12px rgba(91,74,63,.14);display:flex;align-items:center;justify-content:center;gap:4%;padding:2% 4%;z-index:2}
.bubble.empty{visibility:hidden}
.bubble .arr{height:86%;aspect-ratio:1;max-width:42%;min-width:0;display:flex;align-items:center;justify-content:center;flex:0 1 auto}
.bubble .word{font-size:clamp(22px,min(6vw,calc(var(--vh,1vh)*6)),40px);font-weight:800;white-space:nowrap}
.bubble .word.inv{color:var(--magic)}
.bubble.route{gap:3%;right:3%;max-width:none}
.rslot{flex:1 1 0;max-width:31%;height:auto;max-height:90%;aspect-ratio:1;min-width:0;overflow:hidden;border-radius:14px;border:3px dashed var(--phLine);background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;padding:6%;flex:none}
.rslot.cur{border-color:var(--glow);box-shadow:0 0 0 5px rgba(242,193,78,.5)}
.rslot.ok{border-style:solid;border-color:var(--right)}
.rslot .arr{width:100%;height:100%;max-width:none}.rslot .num{font-size:clamp(18px,4vw,28px);font-weight:800;color:#B9ADA1}
.dirL img{transform:scaleX(-1)} .dirS img{transform:rotate(-90deg)} .dirR img{transform:none}
.fonar{position:absolute;right:3%;top:4%;height:30%;aspect-ratio:1;z-index:2;display:none}
.fonar.on{display:block;filter:drop-shadow(0 0 14px rgba(142,107,191,.95));animation:fonar 1.6s ease-in-out infinite}
@keyframes fonar{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.road{position:absolute;left:0;right:0;bottom:3%;height:40%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.car{height:100%;width:44%;display:flex;align-items:flex-end;justify-content:center;will-change:transform}
.car.goL{animation:goL 1.3s ease-in-out}
.car.goR{animation:goR 1.3s ease-in-out}
.car.goS{animation:goS 1.3s ease-in-out}
.car.stop{animation:stop .5s ease-in-out}
@keyframes goR{0%{transform:none;opacity:1}55%{transform:translateX(90%);opacity:1}56%{opacity:0}57%{transform:translateX(-90%);opacity:0}58%{opacity:1}100%{transform:none}}
@keyframes goL{0%{transform:scaleX(-1);opacity:1}55%{transform:translateX(-90%) scaleX(-1);opacity:1}56%{opacity:0}57%{transform:translateX(90%) scaleX(-1);opacity:0}58%{opacity:1}99%{transform:scaleX(-1)}100%{transform:none}}
@keyframes goS{0%{transform:none;opacity:1}55%{transform:translateY(-55%) scale(.45);opacity:0}60%{transform:translateY(15%) scale(1);opacity:0}100%{transform:none;opacity:1}}
@keyframes stop{0%,100%{transform:none}25%{transform:translateX(-3%) rotate(-2deg)}50%{transform:translateX(3%) rotate(2deg)}75%{transform:translateX(-1%)}}
/* зеркало: герой лицом к ребёнку, две его руки — две большие зоны */
.mirror{position:absolute;inset:4% 0 3%;display:none;align-items:center;justify-content:center;z-index:3}
.mirror.on{display:flex}
.mirror.on{container-type:size}
.mfig{position:relative;height:auto;aspect-ratio:346/427;width:min(96cqw,calc(100cqh * 346 / 427))}
.mfig>img,.mfig>.ph{width:100%;height:100%}
.mzone{position:absolute;top:0;bottom:0;width:50%;border-radius:20px;min-width:64px}
.mzone.zl{left:0}.mzone.zr{right:0}
.mzone.hint{animation:hintGlowZ 1.4s ease-in-out infinite}
@keyframes hintGlowZ{0%,100%{background:rgba(242,193,78,0)}50%{background:rgba(242,193,78,.35)}}

#scr-play.mir{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)!important;grid-template-areas:"sc"!important;padding-top:var(--top)!important}
#scr-play.mir .drv{display:none}
#scr-play.mir .scene{background-image:none!important;background-color:#FBF1E3}
/* кнопки-рули */
.drv{position:relative;min-width:0;min-height:64px;height:min(calc(var(--vh,1vh)*22),170px);border-radius:24px;background:var(--card);border:4px solid transparent;box-shadow:0 4px 0 var(--line),0 6px 14px rgba(91,74,63,.12);display:flex;align-items:center;justify-content:center;padding:8px;transition:border-color .2s,background .2s}
.drv:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.drv .pic{position:relative;height:min(100%,calc((100vw - 40px) / 3 - 24px));aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.drv.dL{grid-area:L;background:var(--leftSoft)}
.drv.dR{grid-area:R;background:var(--rightSoft)}
.drv.dS{grid-area:S}
.drv.dS .pic{height:88%}
.drv.hint{animation:hintGlow 1.4s ease-in-out infinite}
.drv.sel{border-color:var(--glow)}
.drv.off{visibility:hidden}
@keyframes hintGlow{0%,100%{box-shadow:0 4px 0 var(--line),0 0 0 0 rgba(242,193,78,0)}50%{box-shadow:0 4px 0 var(--line),0 0 0 10px rgba(242,193,78,.7)}}
.drv.dL .brc{left:30%;bottom:1%;width:40%;height:14%}

/* ---------- финал и мостик ---------- */
.finRow{display:flex;align-items:flex-end;justify-content:center;gap:4vw;width:100%}
.finReg{height:min(calc(var(--vh,1vh)*22),150px);width:min(26vw,160px);display:flex;align-items:flex-end;justify-content:center}
.finCar{height:min(calc(var(--vh,1vh)*20),140px);width:min(34vw,220px);display:flex;align-items:flex-end;justify-content:center}
.fincircle{--d:min(30vw,calc(var(--vh,1vh)*22),160px)}
.trail{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.trail .t{width:var(--s,44px);height:var(--s,44px);border-radius:12px;background:#fff;box-shadow:0 2px 0 var(--line);padding:6px;display:flex;align-items:center;justify-content:center}
.bigtrail{flex:1;min-height:0;align-content:center;--s:min(13vw,calc(var(--vh,1vh)*10),72px)}
#scr-bridge{display:grid;grid-template-columns:76px minmax(0,1fr) 76px;grid-template-rows:auto auto minmax(0,1fr);
  grid-template-areas:"ag top hm" "town town town" "card card card";align-items:center;justify-items:center;gap:10px 8px;padding-top:10px}
.brTop{grid-area:top;display:flex;align-items:flex-end;justify-content:center;gap:8px;min-width:0}
.brTop .reg2{height:min(calc(var(--vh,1vh)*14),120px);width:min(22vw,110px);display:flex;align-items:flex-end;justify-content:center}
.brMost{width:min(30vw,calc(var(--vh,1vh)*16),170px);height:min(30vw,calc(var(--vh,1vh)*16),170px);flex:none}
.brTrail{grid-area:town;--s:min(38px,8vw)}
#againBtn{grid-area:ag}#homeBtn{grid-area:hm}
#scr-bridge .ibtn{width:72px;height:72px;padding:12px}
.adultCard{grid-area:card;align-self:start;max-height:100%;overflow-y:auto;background:#fff;border-radius:20px;border:3px solid var(--line);padding:10px 14px;font-size:21px;line-height:1.28;max-width:640px;width:100%}
.adultCard p{margin:0 0 6px}.adultCard p:last-child{margin:0}
.adultCard .lbl{display:block;font-size:14px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}

/* ---------- пауза ---------- */
#pause{position:absolute;inset:0;z-index:40;background:rgba(91,74,63,.55);display:none;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
#pause.on{display:flex}
#pause .ibtn{width:104px;height:104px;border-radius:26px;padding:20px}
#pause #resumeBtn{width:140px;height:140px;border-radius:50%;background:#FFE7C2;padding:34px 30px 34px 40px}

/* ---------- окно взрослого ---------- */
#adult{position:absolute;inset:0;z-index:50;background:rgba(91,74,63,.6);display:none;justify-content:center;align-items:flex-start;overflow-y:auto;overflow-x:hidden;padding:12px}
#adult.on{display:flex}
.sheet{background:var(--bg);border-radius:22px;max-width:680px;width:100%;padding:18px 18px 24px;font-size:17px;line-height:1.45;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet h2{font-size:20px;margin:18px 0 6px}.sheet h2:first-of-type{margin-top:6px}
.sheet ul,.sheet ol{margin:4px 0;padding-left:22px}
.sheet .three{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-size:19px}
.sheet .three p{margin:0 0 8px}
.sheet .before{background:var(--leftSoft);border-radius:14px;padding:8px 12px;font-weight:700}
.sheet .closeRow{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.tbtn{min-height:48px;padding:8px 16px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:16px}
.tbtn.main{background:var(--leftSoft);border-color:#EAB77C}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.seg button{min-height:46px;padding:6px 12px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:15px;font-weight:700}
.seg button.on{background:var(--rightSoft);border-color:var(--right)}
.seg .sw{display:inline-block;width:18px;height:18px;border-radius:5px;border:2px solid #5B3A1F;vertical-align:-3px;margin-right:6px}
.setl{font-weight:800;font-size:15px;margin-top:8px}
.log{font-size:15px;background:#fff;border-radius:12px;padding:8px 12px;border:1px solid var(--line)}
.sheet .sign{margin-top:24px;opacity:.75;font-weight:700}

/* ---------- черновой голос ---------- */
#draft{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--draft);color:#fff;font-size:13px;padding:5px 10px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#draft.on{opacity:.92}

.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
body.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){
  #playBtn,.nextBtn.pulse,.fonar.on,.nav.talk{animation:none}
  .car.goL,.car.goR,.car.goS{animation-duration:1.8s}
  .dot{transition-duration:1.2s}
}

/* ---------- альбом: левая кнопка слева, правая справа, прямо — под дорогой ---------- */
@media (orientation:landscape){
  :root{--top:70px; --cw:min(220px,calc((100vw - 40px) * .24))}
  #scr-play{padding-top:8px;grid-template-columns:var(--cw) minmax(0,1fr) var(--cw);grid-template-rows:62px minmax(0,1fr) auto;grid-template-areas:"L . R" "L sc R" "L S R"}
  body[data-scr=play] #topbar,body[data-scr=learn] #topbar{left:calc(var(--cw) + 18px);right:calc(var(--cw) + 18px);height:70px;padding:4px 0 0;align-items:flex-start}
  .drv.dL,.drv.dR{height:auto;align-self:stretch}
  .drv.dL .pic,.drv.dR .pic{height:auto;width:100%;max-height:70%}
  .drv.dS{height:min(calc(var(--vh,1vh)*18),96px);width:min(260px,100%);justify-self:center}
  #scr-bridge{grid-template-columns:minmax(80px,1fr) minmax(80px,1fr) minmax(0,min(640px,62vw));grid-template-rows:minmax(0,1fr) auto auto;
    grid-template-areas:"top top card" "town town card" "ag hm card";column-gap:14px}
  .adultCard{align-self:center}
  .brMost{width:min(14vw,calc(var(--vh,1vh)*26),170px);height:min(14vw,calc(var(--vh,1vh)*26),170px)}
  .brTop .reg2{height:min(calc(var(--vh,1vh)*26),150px);width:min(12vw,130px)}
  .lift{height:min(calc(var(--vh,1vh)*58),420px)}
}
@media (orientation:portrait) and (max-height:620px){ .adultCard{line-height:1.22} #scr-bridge{gap:6px} }
@media (max-width:400px){ .corner{font-size:13px} #scr-play{gap:8px} }
@media (max-height:420px){ :root{--top:68px}
  .screen{padding-left:6px;padding-right:6px;padding-bottom:6px}
  #scr-bridge .ibtn{width:64px;height:64px;padding:11px} .adultCard{line-height:1.22;padding:8px 12px} }
</style>
</head>
<body>
<h1>Навигатор: лево и право. Игра для подготовки к школе</h1>
<div id="app">
  <div id="topbar">
    <div class="corner" id="sign">Дядя Миша</div>
    <button class="ibtn hide" id="pauseBtn" aria-label="Пауза"></button>
    <button class="ibtn hide" id="earBtn" aria-label="Послушать ещё раз"></button>
    <button class="ibtn" id="infoBtn" aria-label="Для взрослого">i</button>
  </div>

  <!-- I блок: вход -->
  <section class="screen" id="scr-intro" aria-label="Заставка">
    <div class="title">Навигатор</div>
    <div class="introRow">
      <div class="introNav" id="introNav"></div>
      <button id="playBtn" aria-label="Играть"></button>
      <div class="introCar" id="introCar"></div>
    </div>
  </section>

  <section class="screen" id="scr-breath" aria-label="Дыхание и лифт">
    <div class="bwrap" id="bWrap">
      <div class="breg" id="bReg"></div>
      <div class="bcircle" id="bCircle"><div class="bi" id="bNose"></div><div class="bi" id="bMouth" style="opacity:0"></div><div class="bi" id="bCheck" style="opacity:0"></div></div>
    </div>
    <div class="bwrap hide" id="liftWrap">
      <div class="lift" id="lift"><div class="dot" id="dot"></div></div>
    </div>
    <button class="nextBtn vhide" id="bNext" aria-label="Дальше"></button>
  </section>

  <!-- II–III блок: обучение и игра -->
  <section class="screen" id="scr-play" aria-label="Игра">

/* ================= ЗВУК (ядро zvuk-igr-dyadya-misha) ================= */
const A = {
  ctx:null, on:true,
  ensure(){
    if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(f,dur,vol,type,slideTo){
    if(!this.on) return;
    const c=this.ensure(); if(!c) return;
    if(V.busy) vol*=0.45;                                  // эффект во время речи — тише голоса
    const t=c.currentTime, o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur*0.8);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+dur*0.18);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.05);
  },
  tap(){     this.tone(660,0.13,0.16,'sine',880); },
  release(){ this.tone(392,0.75,0.15,'sine',587); },
  right(){   this.tone(523,0.35,0.15,'sine',784); },
  hint(){    this.tone(440,0.40,0.12,'sine',392); },
  inhale(){  this.tone(330,0.45,0.09,'sine',440); },
  exhale(){  this.tone(392,0.70,0.09,'sine',262); },
  done(){ [262,330,392,523].forEach((f,i)=>setTimeout(()=>this.tone(f,0.9,0.14),i*120)); },
  /* своё для игры 11: у каждой стороны своя высота */
  goL(){ this.tone(392,0.5,0.12,'triangle',349); },
  goS(){ this.tone(494,0.5,0.12,'triangle',523); },
  goR(){ this.tone(587,0.5,0.12,'triangle',659); },
  lift(i){ this.tone([262,294,330,349,392][i]||392,0.4,0.1,'sine'); },
  bell(){ [1568,2093].forEach((f,i)=>setTimeout(()=>this.tone(f,1.4,0.07,'sine'),i*180)); },
  dzin(){ this.tone(988,0.30,0.07,'sine',1175); }       // черновой голос: нет mp3
};

/* ================= ВРЕМЯ, ПАУЗА, ОТМЕНА ================= */
const RT = { epoch:0, paused:false };
class Cancel extends Error{}
function chk(ep){ if(ep!==RT.epoch) throw new Cancel(); }
function ptimer(ms, cb){
  let left=ms, last=performance.now(), dead=false;
  const t=setInterval(()=>{ const now=performance.now(); if(!RT.paused) left-=now-last; last=now; if(left<=0){ clearInterval(t); if(!dead) cb(); } },40);
  return ()=>{ dead=true; clearInterval(t); };
}
function sleep(ms){ const ep=RT.epoch; return new Promise((res,rej)=>{ ptimer(ms,()=> ep===RT.epoch ? res() : rej(new Cancel())); S.cancels.push(()=>rej(new Cancel())); }); }

/* ================= ГОЛОС ДЯДИ МИШИ ================= */
const V = {
  el:null, cache:{}, busy:false, token:0, _res:null, _kill:null,
  stop(){
    this.token++;
    if(this.el){ try{ this.el.pause(); }catch(e){} this.el=null; }
    if(this._kill){ this._kill(); this._kill=null; }
    this.busy=false;
    const r=this._res; this._res=null; if(r) r();
  },
  say(key){
    this.stop();
    const tk=this.token, text=VOICE[key]||key;
    return new Promise(res=>{
      this._res=res; this.busy=true;
      const done=()=>{ if(tk!==this.token) return; this.busy=false; this._res=null; this.el=null; draftOff(); res(); };
      const draft=()=>{
        if(tk!==this.token) return;
        draftOn(key,text);
        if(A.on) A.dzin();
        const ms = A.on ? Math.min(4800, 700+text.length*62) : Math.min(1400, 400+text.length*25);
        this._kill=ptimer(ms,done);
      };
      if(ZVUK[key] && A.on){
        let a=this.cache[key]; if(!a){ a=new Audio(ZVUK[key]); this.cache[key]=a; }
        try{ a.currentTime=0; }catch(e){}
        this.el=a; a.onended=done; a.onerror=draft;
        if(!RT.paused){ const p=a.play(); if(p&&p.catch) p.catch(()=>{ if(!RT.paused) draft(); }); }

/* ================= ДЫХАНИЕ ================= */
function breathe(ep, cycles, circle, nose, mouth, extra){
  const B=CONFIG.breath;
  return new Promise((res,rej)=>{
    let t=0, last=performance.now(), cyc=0, phase=-1;
    const total=(B.inMs+B.outMs);
    const ease=x=>0.5-0.5*Math.cos(Math.PI*x);
    function frame(now){
      if(ep!==RT.epoch){ rej(new Cancel()); return; }
      const dt=Math.min(100, now-last); last=now; if(!RT.paused) t+=dt;
      const inCyc=t-cyc*total;
      if(inCyc>=total){ cyc++; if(cyc>=cycles){ apply(B.lo,0); res(); return; } }
      const x=t-cyc*total, isIn=x<B.inMs;
      const ph=isIn?0:1;
      if(ph!==phase){ phase=ph; if(isIn){ A.inhale(); V.say('ob_vdoh'); } else { A.exhale(); V.say('ob_vydoh'); } }
      const k = isIn ? B.lo+(B.hi-B.lo)*ease(x/B.inMs) : B.hi-(B.hi-B.lo)*ease((x-B.inMs)/B.outMs);
      const mOp = isIn ? Math.max(0,1-x/350) : Math.min(1,(x-B.inMs)/350);
      apply(k,mOp);
      requestAnimationFrame(frame);
    }
    function apply(k,mOp){
      circle.style.transform='scale('+k.toFixed(4)+')';
      if(extra) extra.style.transform='scale('+(0.94+(k-B.lo)*0.35).toFixed(4)+')';
      nose.style.opacity=(1-mOp).toFixed(3); mouth.style.opacity=mOp.toFixed(3);
    }
    apply(B.lo,0); requestAnimationFrame(frame);
  });
}

/* ================= ПОДСТРОЙКА ТРУДНОСТИ =================
   Задание = одна команда (маршрут из 3 — одно задание, вопрос-зеркало — одно задание).
   1-й промах: машинка стоит, навигатор повторяет, браслет мигает.
   2-й промах = подсказка: нужная кнопка светится, стрелка возвращается, «Где твой браслет?».
   Трудное задание — 2+ промаха (при двух кнопках третий промах почти невозможен: после второго
   нужная кнопка уже светится). Чистое — без промахов и подсказки.
   2 трудных подряд → опора (браслет мигает всё время, стрелка рядом со словом, маршрут не прячется);
   ещё 2 трудных → уровень ниже. 2 чистых подряд → опора уходит; ещё 2 чистых → уровень выше.
   «Ухо» не считается. Смена незаметна. */
const HINT_AT=2;
function afterTask(misses, hinted, fast){
  const L=S.log, hard=misses>=HINT_AT, clean=misses===0 && !hinted;
  L.tasks++; if(hard) L.hard++; if(clean) L.clean++;
  S.prevHard=hard;
  if(S.calib){
    S.calib.push({clean, fast, miss:misses>0});
    if(S.calib.length>=2){
      const r=layerRange(), c=S.calib; S.calib=null;
      let lv=Math.floor((r[0]+r[1])/2);                 // середина; обе быстро и чисто — на ступень выше
      if(c.every(x=>x.miss)) lv=r[0];
      else if(c.every(x=>x.clean&&x.fast)) lv=Math.min(r[1],lv+1);
      S.level=clamp(lv,r); S.set.level=S.level; saveSet(); L.levels.push('старт '+S.level);
    }
    return;
  }
  if(hard){ S.hardRun++; S.cleanRun=0; } else if(clean){ S.cleanRun++; S.hardRun=0; } else { S.hardRun=0; S.cleanRun=0; }
  const canLevel = S.set.mode==='auto'||S.set.mode==='manual', canSupport = S.set.mode!=='easy';
  const shift=d=>{ const nl=clamp(S.level+d,layerRange()); if(nl!==S.level){ S.level=nl; S.set.level=nl; saveSet(); L.levels.push((d>0?'↑':'↓')+nl); } };
  if(S.hardRun>=2){
    S.hardRun=0;
    if(!S.support){ if(canSupport){ S.support=true; L.supports++; L.levels.push('опора'); } }
    else if(canLevel) shift(-1);
  }
  if(S.cleanRun>=2){
    S.cleanRun=0;
    if(S.support){ if(canSupport){ S.support=false; L.levels.push('без опоры'); } }
    else if(canLevel) shift(+1);
  }
  setSupportView();
}

/* выбрать следующую команду: лево/право поровну, не больше двух одинаковых подряд, «прямо» изредка */
function nextDir(allowS){
  const h=S.lastDirs;
  if(allowS && Math.random()<CONFIG.straightP && h[h.length-1]!=='S') return push('S');
  const nL=h.filter(x=>x==='L').length, nR=h.filter(x=>x==='R').length;
  let d = nL===nR ? rnd(['L','R']) : (nL<nR?'L':'R');
  if(h.length>=2 && h[h.length-1]===d && h[h.length-2]===d) d=flip(d);
  return push(d);
  function push(x){ h.push(x); if(h.length>8) h.shift(); return x; }
}

async function askUntil(ep, want, ask, soft){

  while(true){
    const ev=await waitTap(ep);
    if(ev.d===want) { S.lock=true; return; }
    A.hint(); carStop(); soft(); await ask();
  }
}

/* ---- II–III блок: игра ---- */
FLOW.play = async ep=>{
  renderScene();
  if(!S.log) S.log=newLog();
  const R=S.set.rounds;
  for(let round=0; round<R; round++){
    chk(ep);
    const lenNow=()=>CONFIG.roundLen[Math.min(S.level,6)]*(S.level===4 && S.set.age==='senior' ? 1.5 : 1)|0;   // уровень вырос посреди раунда — раунд короче
    let swDone=0, invLeft=0, offAt=-9;
    const maxSw = S.set.age==='senior' ? rnd([1,2]) : 1;
    for(let t=0;t<lenNow();t++){
      const len=lenNow();
      chk(ep);
      const lastOfGame = round===R-1 && t===len-1;
      let lv=S.level;
      if(lastOfGame && S.prevHard) lv=Math.max(layerRange()[0], Math.min(lv,2));   // после трудного — последнее лёгкое
      /* волшебный фонарь: только уровень 4, только если хватает заданий, чтобы погасить его и закончить обычным */
      const canSw = lv===4 && S.set.sw && S.set.mode!=='easy' && !S.calib;
      if(canSw && !S.inv && swDone<maxSw && t>=2 && t-offAt>=2 && len-t>=CONFIG.invLen[0]+1 && !lastOfGame){
        S.inv=true; swDone++; invLeft=Math.min(rnd(CONFIG.invLen), len-t-1); S.log.sw++; S.swAt=S.log.tasks;
        await lanternOn(ep);
      }
      if(S.inv && lv!==4){ S.inv=false; await lanternOff(ep); }
      S.log.levels.push('L'+lv+(S.inv?'⇄':''));
      if(lv===1) await taskBody(ep);
      else if(lv<=4) await taskCmd(ep, lv);
      else if(lv===5) await taskRoute(ep);
      else await taskMirror(ep);
      if(S.inv){ invLeft--; if(invLeft<=0){ S.inv=false; offAt=t+1; await lanternOff(ep); } }   // между фонарями — минимум 2 обычных
    }
    if(S.inv){ S.inv=false; await lanternOff(ep); }
    if(round<R-1){ A.done(); await say(ep,'ob_zdorovo'); }
  }
  go('finish');
};

async function taskBody(ep){

/* L2–L4: навигатор говорит, водитель жмёт */
async function taskCmd(ep, lv){
  mirrorOff(); buttonsFor(['L','S','R']); glowBtn('');
  const d=nextDir(!S.inv && lv>=2), want=S.inv?flip(d):d;
  const show=(h)=>cmdBubble(d, lv===2 || S.support || h || !showWord());
  show(false);
  if(S.inv) S.log.invTasks++;
  await oneCommand(ep, d, want, ()=>instr(ep, CONTENT.cmd[d].v), ()=>show(true), false);
}
/* одна команда: ждём верный руль; промахи мягкие */
async function oneCommand(ep, d, want, ask, onHint, body){
  let miss=0, hinted=false;
  S.want=want; S.lock=false;
  await ask();
  const t0=performance.now();
  while(true){
    const ev=await waitTap(ep);
    if(ev.d===want){
      S.lock=true; glowBtn(''); $('#btn'+ev.d).classList.add('sel');
      S.log.rt.push(Math.round(performance.now()-t0));
      A.right(); S.trail.push(want);
      await drive(ep, want);
      $('#btn'+ev.d).classList.remove('sel');
      if(body) await say(ep,'ob_est');
      afterTask(miss, hinted, performance.now()-t0<CONFIG.fastMs);
      if(S.inv && S.log.tasks-S.swAt<=2 && miss) S.log.afterSw+=miss;
      return;
    }
    /* мимо: машинка стоит, браслет мигает, навигатор повторяет */
    miss++; S.log.miss++; S.log['miss'+want]++; if(S.inv) S.log.invMiss++;
    S.lock=true; A.hint(); carStop(); flashBrc();
    if(miss>=HINT_AT && !hinted){
      hinted=true; S.log.hints++; glowBtn(want); onHint();
      S.lock=false;
      await instr(ep, S.inv?'11_naoborot':'11_braslet');
      if(!S.pending) await instr(ep, body?CONTENT.body[d]:CONTENT.cmd[d].v);
    } else {
      if(hinted) glowBtn(want);
      S.lock=false; await ask();
    }
  }
}

/* L5: маршрут из трёх поворотов — запомнить и проехать */
async function taskRoute(ep){
  mirrorOff(); buttonsFor(['L','S','R']); glowBtn('');
  let pool=CONTENT.routes.map((r,i)=>i).filter(i=>!S.usedRoutes.has(i)); if(!pool.length){ S.usedRoutes.clear(); pool=CONTENT.routes.map((r,i)=>i); }
  const ri=rnd(pool); S.usedRoutes.add(ri); const route=CONTENT.routes[ri];
  S.log.routes++;
  const draw=(show, cur)=>bubble(route.map((d,i)=>'<div class="rslot'+(i===cur?' cur':'')+(show[i]?' ok':'')+'">'+(show[i]?arrow(d):'<span class="num">'+(i+1)+'</span>')+'</div>').join(''),'route');
  const all=[true,true,true];
  S.lock=true;
  draw([false,false,false],-1);
  S.lastInstr=['11_zapomni'].concat(route.map(d=>CONTENT.cmd[d].v));
  await say(ep,'11_zapomni');
  const seen=[false,false,false];
  for(let i=0;i<3;i++){ seen[i]=true; draw(seen,i); navTalk(); await say(ep, CONTENT.cmd[route[i]].v); await sleep(250); }
  await sleep(600);
  const open=S.support?all.slice():[false,false,false];
  let miss=0, hinted=false; const t0=performance.now();
  for(let k=0;k<3;k++){
    draw(open,k);
    const want=route[k]; S.want=want;
    S.lock=false;
    let kMiss=0;
    while(true){
      const ev=await waitTap(ep);
      if(ev.d===want){ S.lock=true; glowBtn(''); open[k]=true; draw(open,k); A.right(); S.trail.push(want); await drive(ep,want); break; }
      miss++; kMiss++; S.log.miss++; S.log['miss'+want]++;
      S.lock=true; A.hint(); carStop(); flashBrc();
      if(kMiss>=HINT_AT){ if(!hinted){ hinted=true; S.log.hints++; } open[k]=true; draw(open,k); glowBtn(want); S.lock=false; await instr(ep, CONTENT.cmd[want].v); }
      else { S.lock=false; }
    }
  }
  if(!miss) S.log.routesClean++;
  afterTask(miss, hinted, performance.now()-t0<CONFIG.fastMs*3);
  await sleep(300); bubble('');
}

/* L6: зеркало — герой стоит лицом, где у него левая (правая) рука? */
async function taskMirror(ep){
  buttonsFor([]); bubble(''); mirrorOn();
  const askLeft = S.log.mirror%2===0 ? Math.random()<0.6 : Math.random()<0.4;
  const want = askLeft ? 'R' : 'L';               // у стоящего лицом левая рука — справа от ребёнка
  const key = askLeft ? '11_zerkalo' : '11_zerkalo_pravaya'; S.want=want;
  const b=$('#mfig .brc'); if(b) b.classList.toggle('vhide', !S.support);
  S.log.mirror++;
  let miss=0, hinted=false; const t0=performance.now();
  S.lock=false; await instr(ep,key);
  while(true){
    const ev=await waitTap(ep);
    if(ev.d===want){
      S.lock=true; document.querySelectorAll('.mzone').forEach(z=>z.classList.remove('hint'));
      const z=$('#mfig .z'+(want==='L'?'l':'r')); z.classList.add('hint'); A.right();
      if(!miss) S.log.mirrorFirst++;
      await say(ep,'ob_est'); z.classList.remove('hint');
      afterTask(miss, hinted, performance.now()-t0<CONFIG.fastMs);
      break;
    }
    miss++; S.log.miss++; A.hint();
    const f=$('#mfig'); f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop');
    if(miss>=HINT_AT && !hinted){ hinted=true; S.log.hints++; if(b) b.classList.remove('vhide'); $('#mfig .z'+(want==='L'?'l':'r')).classList.add('hint'); }
    S.lock=false; await instr(ep,key);
  }
  mirrorOff(); buttonsFor(['L','S','R']);
}

/* ---- IV блок: приехали, выдох, мостик ---- */
function trailInto(el, n){
  el.innerHTML='';
  S.trail.slice(-n).forEach(d=>{ const t=document.createElement('div'); t.className='t dir'+d; t.innerHTML=pic('ikonka_strelka',CONTENT.cmd[d].w); el.appendChild(t); });
}
FLOW.finish = async ep=>{
  S.lock=true;
  trailInto($('#bigtrail'), 24);
  $('#finReg').innerHTML=pic('geroy_navigator','навигатор');
  $('#finCar').innerHTML=pic('predmet_mashinka_sboku','машинка');
  $('#fNose').innerHTML=pic('ikonka_nos','нос'); $('#fMouth').innerHTML=pic('ikonka_rot','рот');
  A.done();
  await sleep(600);
  await say(ep,'ob_zdorovo','ob_spasibo');
  await breathe(ep, 1, $('#fCircle'), $('#fNose'), $('#fMouth'), $('#finCar'));
  await sleep(500);
  go('bridge');
};

FLOW.bridge = async ep=>{
  S.lock=true;
  $('#brReg').innerHTML=pic('predmet_mashinka_sboku','машинка');
  $('#brMost').innerHTML=pic('geroy_most_nesi_telefon','неси телефон взрослому');

  $('#brCard').innerHTML='<span class="lbl">Для взрослого</span>'+CONTENT.adult3.map(t=>'<p>'+t+'</p>').join('');
  const coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  await sleep(500);
  await say(ep, coarse?'ob_otnesi':'ob_pozovi', '11_most', 'ob_esli_zanyaty');
};

/* ================= ОКНО ВЗРОСЛОГО ================= */
function sheetHTML(){
  const L=S.log, st=S.set;
  const seg=(key,opts)=>'<div class="seg" data-k="'+key+'">'+opts.map(o=>'<button data-v="'+o[0]+'" class="'+(String(st[key])===String(o[0])?'on':'')+'">'+o[1]+'</button>').join('')+'</div>';
  const avg = L && L.rt.length ? (L.rt.reduce((a,b)=>a+b,0)/L.rt.length/1000).toFixed(1)+' с' : '—';
  const log = L ? '<div class="log">Заданий: '+L.tasks+' · чистых: '+L.clean+' · трудных (2+ промаха): '+L.hard+' · подсказок: '+L.hints+
    '<br>Промахов: '+L.miss+' (нужно было налево — '+L.missL+', направо — '+L.missR+', прямо — '+L.missS+')'+
    '<br>Фонарь загорался: '+L.sw+' · заданий «наоборот»: '+L.invTasks+' · промахов в них: '+L.invMiss+' · из них в первых двух после смены: '+L.afterSw+
    '<br>Маршрутов: '+L.routes+' · без промаха: '+L.routesClean+' · Зеркало: '+L.mirror+' · с первого раза: '+L.mirrorFirst+
    '<br>Время до нажатия: '+avg+' · Опора включалась: '+L.supports+' · паузы 15 с: '+L.idle+
    '<br>Уровни: '+(L.levels.join(' → ')||'—')+'</div>' : '<div class="log">Игра ещё не начата.</div>';
  return ''+
  '<div class="closeRow"><button class="tbtn main" data-act="close">Вернуться к игре</button></div>'+
  '<h2>Три строки для взрослого</h2><div class="three">'+CONTENT.adult3.map(t=>'<p>'+t+'</p>').join('')+'</div>'+
  '<p class="before">Перед игрой наденьте ребёнку резинку или ленточку на левую руку. Такой же браслет — на левой кнопке. Цвет можно выбрать ниже.</p>'+
  '<h2>Правило</h2><p>Навигатор говорит «налево» — жми кнопку с браслетом. Горит волшебный фонарь — всё наоборот.</p>'+
  '<h2>Что тренирует</h2><p>Лево-право от своего тела к пространству; переключение, когда правило меняется; удержание маршрута из трёх шагов (8+ лет).</p>'+
  '<h2>Как помочь</h2><ol><li>«Лифт» дома как разминка: рука едет по телу вверх и вниз.</li><li>Называйте сторону через браслет: «Где браслет? Это левая».</li><li>Хвалите, когда остановился и подумал, а не когда быстро.</li></ol>'+
  '<p>Ошибок в игре нет: машинка просто стоит, навигатор повторяет, браслет мигает. Второй промах — нужная кнопка светится.</p>'+
  '<p><b>Подстройка сама.</b> Два трудных задания подряд — опора: браслет мигает всё время, рядом со словом снова стрелка. Ещё два трудных — уровень ниже. Два чистых подряд — опора уходит, ещё два — уровень выше. Повтор фразы кнопкой-ухом не считается.</p>'+
  '<p>Уровни: 1 — своё тело («подними левую руку»); 2 — стрелка и слово; 3 — только слово; 4 — волшебный фонарь, правило наоборот; 5 — маршрут из трёх поворотов; 6 — зеркало: где левая рука у того, кто стоит лицом.</p>'+
  '<h2>Если трудно</h2><p>Режим «Легко» — тело и стрелки, без смены правила. Играйте рядом и спрашивайте: «Где браслет?»</p>'+
  '<h2>Сколько играть</h2><p>5–7 минут, 1 раз в день. Лучше каждый день понемногу.</p>'+
  '<h2>Для специалиста</h2><p>Опирается ли на браслет (смотрит на руку перед нажатием); сколько промахов сразу после смены правила; держит ли маршрут из трёх; справляется ли с зеркальной позицией.</p>'+log+
  '<h2>Настройки</h2>'+
  '<div class="setl">Возраст</div>'+seg('age',[['baby','5–6 лет'],['junior','6–7 лет'],['senior','8–9 лет']])+
  '<div class="setl">Трудность</div>'+seg('mode',[['auto','Сама'],['easy','Легко'],['hard','Трудно — вместе'],['manual','Начать с уровня…']])+
  (st.mode==='manual'?seg('startLevel',[[1,'1 · тело'],[2,'2 · стрелка+слово'],[3,'3 · слово'],[4,'4 · фонарь'],[5,'5 · маршрут'],[6,'6 · зеркало']]):'')+
  '<div class="setl">Цвет браслета</div><div class="seg" data-k="brc">'+CONTENT.brColors.map(c=>'<button data-v="'+c[0]+'" class="'+(st.brc===c[0]?'on':'')+'"><span class="sw" style="background:'+c[0]+'"></span>'+c[1]+'</button>').join('')+'</div>'+
  '<div class="setl">Волшебный фонарь (смена правила)</div>'+seg('sw',[[true,'Включён'],[false,'Выключен']])+
  '<div class="setl">Раундов за игру</div>'+seg('rounds',CONFIG.roundsOptions.map(n=>[n,String(n)]))+
  '<div class="setl">Звук и голос</div>'+seg('sound',[[true,'Включён'],[false,'Выключен']])+
  (CONFIG.draft?'<div class="setl">Черновой голос: полоска с текстом фразы</div>'+seg('draftBar',[[true,'Показывать'],[false,'Скрыть']]):'')+
  '<p style="font-size:14px;color:var(--ink2)">Сейчас уровень '+(S.level||'—')+'. Возраст и трудность применятся со следующей игры. <button class="tbtn" data-act="resetLevel">Сбросить подстройку</button></p>'+
  '<div class="closeRow" style="margin-top:14px"><button class="tbtn" data-act="home">Домой</button><button class="tbtn" data-act="restart">Начать заново</button><button class="tbtn main" data-act="close">Вернуться к игре</button></div>'+
  '<p class="sign">Дядя Миша · © 2026 Михаил Лесоневич · «Первый класс без слёз»</p>';
}
function openAdult(){ A.tap(); setPaused(true,false); $('#sheet').innerHTML=sheetHTML(); $('#adult').classList.add('on'); $('#adult').scrollTop=0; }
function closeAdult(){ $('#adult').classList.remove('on'); if(!$('#pause').classList.contains('on')) setPaused(false); }
$('#sheet').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; A.tap();
  const seg=b.closest('.seg');
  if(seg){
    const k=seg.dataset.k; let v=b.dataset.v;
    if(v==='true') v=true; else if(v==='false') v=false; else if(/^\d+$/.test(v)) v=+v;
    S.set[k]=v; if(k==='sound') A.on=v; if(k==='age'||k==='mode'||k==='startLevel') S.set.level=0;
    if(k==='brc') applyBrc();
    if(k==='draftBar' && !v) $('#draft').classList.remove('on');
    saveSet(); const y=$('#adult').scrollTop; $('#sheet').innerHTML=sheetHTML(); $('#adult').scrollTop=y; return;
  }
  const act=b.dataset.act;
  if(act==='close') closeAdult();
  if(act==='resetLevel'){ S.set.level=0; saveSet(); $('#sheet').innerHTML=sheetHTML(); }
  if(act==='home'){ $('#adult').classList.remove('on'); $('#pause').classList.remove('on'); setPaused(false); go('intro'); }
  if(act==='restart'){ $('#adult').classList.remove('on'); $('#pause').classList.remove('on'); setPaused(false); startGame(); go('breath'); }
});
$('#adult').addEventListener('click',e=>{ if(e.target.id==='adult') closeAdult(); });

/* ================= КНОПКИ ================= */
function setupButtons(){
  $('#playBtn').innerHTML=pic('ikonka_igrat','играть');
  $('#pauseBtn').innerHTML=pic('ikonka_pauza','пауза');
  $('#earBtn').innerHTML=pic('ikonka_uho','ещё раз');
  $('#resumeBtn').innerHTML=pic('ikonka_igrat','продолжить');
  $('#pHome').innerHTML=pic('ikonka_domoy','домой'); $('#homeBtn').innerHTML=pic('ikonka_domoy','домой');
  $('#pRestart').innerHTML=pic('ikonka_eshche_raz','заново'); $('#againBtn').innerHTML=pic('ikonka_eshche_raz','ещё раз');
  $('#playBtn').onclick=async()=>{
    if(S.screen!=='intro') return;
    startGame();
    const ep=++RT.epoch; S.lock=true; $('#playBtn').disabled=true;
    try{ await say(ep,'ob_privet','11_vhod'); go('breath'); }catch(e){}
    $('#playBtn').disabled=false;
  };
  $('#bNext').onclick=()=>{ A.tap(); S.waiting=false; go(S.learnSeen?'play':'learn'); };
  $('#pauseBtn').onclick=()=>{ A.tap(); openPause(); };
  $('#resumeBtn').onclick=()=>{ A.tap(); closePause(); };
  $('#pHome').onclick=()=>{ A.tap(); closePause(); setPaused(false); go('intro'); };
  $('#pRestart').onclick=()=>{ A.tap(); closePause(); setPaused(false); startGame(); go('breath'); };
  $('#infoBtn').onclick=openAdult;
  $('#earBtn').onclick=()=>{
    A.tap(); if(RT.paused) return;
    if(!S.lastInstr.length) return;
    if(S.waiting || S.screen==='breath'){ const seq=S.lastInstr.slice(); (async()=>{ for(const k of seq){ await V.say(k); if(!S.waiting && S.screen!=='breath') break; } })(); }
  };
  $('#againBtn').onclick=()=>{ A.tap(); startGame(); go('breath'); };
  $('#homeBtn').onclick=async()=>{ A.tap(); const ep=++RT.epoch; try{ await say(ep,'ob_poka'); }catch(e){} go('intro'); };
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden && !['intro','bridge'].includes(S.screen)) openPause(); else if(document.hidden) V.pause(); });

/* ================= СТАРТ ================= */
function setVH(){ const h=(window.visualViewport&&visualViewport.height)||innerHeight; document.documentElement.style.setProperty('--vh',(Math.min(h,innerHeight)/100)+'px'); }
setVH(); addEventListener('resize',setVH); addEventListener('orientationchange',()=>setTimeout(setVH,250));
if(window.visualViewport) visualViewport.addEventListener('resize',setVH);
loadSet(); setupButtons(); go('intro');
